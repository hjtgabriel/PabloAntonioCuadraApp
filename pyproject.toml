[project]
name = "pablo-antonio-cuadra-app"
version = "1.0.0"
description = "Sistema de gestión y venta para la librería Pablo Antonio Cuadra"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = [
    "E501",  # el largo de línea lo fija line-length, no esta regla
    "D212",  # el resumen va en la línea siguiente a las comillas, no en la misma
    "D205",  # un __init__ puede empezar por «Args:»: el resumen está en la clase
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Las pruebas se nombran de forma que la propia firma explica el caso, y
# además llevan docstring; lo que no necesitan es documentar los fixtures
# de pytest que reciben como parámetros.
"tests/*" = ["D401"]
