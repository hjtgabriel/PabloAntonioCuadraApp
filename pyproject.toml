[project]
name = "pablo-antonio-cuadra-app"
version = "1.0.0"
description = "Sistema de gestión y venta para la librería Pablo Antonio Cuadra"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
